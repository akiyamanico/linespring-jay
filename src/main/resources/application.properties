# ── LINE Credentials ─────────────────────────────────────────────────────────
line.email=
line.password=

# ── LINE Server Config ────────────────────────────────────────────────────────
line.hostDomain=https://legy.line-apps.com
line.obsDomain=https://obs.line-apps.com
line.authPath=/api/v3p/rs
line.talkPath=/api/v3/TalkService.do
line.apiPath=/S4
line.pollPath=/P4
line.certPath=/Q
line.loginQrPath=/acct/lgn/sq/v1
line.permitNoticePath=/acct/lp/lgn/sq/v1

# ── LINE App Identity ─────────────────────────────────────────────────────────
# Tab-separated: APP_TYPE \t APP_VER \t SYSTEM_NAME \t SYSTEM_VER
line.appName=IOSIPAD\t14.0.1\tiOS\t15.0
line.userAgent=Line/14.0.1
line.systemName=iOS
line.appVersion=14.0.1
line.carrier=51089, 1-0
line.ipAddr=8.8.8.8

# ── Google Gemini AI ──────────────────────────────────────────────────────────
gemini.apiKey=${GEMINI_API_KEY:}
gemini.imageModel=gemini-2.0-flash-exp-image-generation

# ── WhatsApp (textmebot) ──────────────────────────────────────────────────────
whatsapp.apiKey=${WHATSAPP_API_KEY:}
whatsapp.numberFile=whatsapp_number.txt

# ── Group Broadcast ───────────────────────────────────────────────────────────
broadcast.file=group_broadcast.txt

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.linepyjay=DEBUG
